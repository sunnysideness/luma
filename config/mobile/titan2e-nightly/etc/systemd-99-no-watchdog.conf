# Bring-up: the device payload sets RuntimeWatchdogSec=20s on mtk-wdt (max
# 31 s). On the generic-nightly graft PID 1 missed the feed about three minutes
# into the boot and the SoC reset. Disabled until the stall is understood; see
# docs/bringup.md. Re-enable with a safe timeout rather than leaving this in a
# release image.
[Manager]
RuntimeWatchdogSec=0
